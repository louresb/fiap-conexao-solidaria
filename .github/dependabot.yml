version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      dotnet-runtime:
        patterns:
          - Microsoft.*
          - System.*
      observability:
        patterns:
          - OpenTelemetry.*
          - Serilog.*
          - prometheus-net.*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      workflow-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      container-images:
        patterns: ["*"]
