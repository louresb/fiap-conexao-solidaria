{{- if .Values.web.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "conexao-solidaria.fullname" . }}-web
  labels:
    {{- include "conexao-solidaria.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.web.ingress.className | quote }}
  rules:
    - host: {{ .Values.web.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.web.ingress.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "conexao-solidaria.fullname" . }}-web
                port:
                  name: http
{{- end }}
