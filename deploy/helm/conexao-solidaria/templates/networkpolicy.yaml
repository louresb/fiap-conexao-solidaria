{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "conexao-solidaria.fullname" . }}-application
  labels:
    {{- include "conexao-solidaria.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "conexao-solidaria.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
{{- end }}
