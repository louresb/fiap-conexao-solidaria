{{- range $name, $component := .Values.components }}
{{- if and (ne ($component.enabled | toString) "false") $component.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "conexao-solidaria.fullname" $ }}-{{ $name }}
  labels:
    {{- include "conexao-solidaria.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: {{ $component.service.type }}
  selector:
    {{- include "conexao-solidaria.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $component.service.port }}
      targetPort: http
      protocol: TCP
      {{- with $component.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
{{- end }}
