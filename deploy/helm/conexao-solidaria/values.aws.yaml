global:
  environment: production
  cloudProvider: aws

image:
  registry: <aws-account-id>.dkr.ecr.us-east-1.amazonaws.com
  tag: latest

serviceAccount:
  annotations: {}

components:
  web:
    autoscaling: &autoscaling
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    disruptionBudget: &pdb
      enabled: true
      minAvailable: 1
    env:
      Gateway__BaseUrl: http://conexao-solidaria-gateway:8080
      Auth__Authority: https://{{ .Values.ingress.host }}/auth/realms/conexao-solidaria
      Auth__RequireHttpsMetadata: "true"
      DemoAccess__Enabled: "true"
      Observability__LokiUrl: http://conexao-solidaria-loki:3100
  gateway:
    autoscaling: *autoscaling
    disruptionBudget: *pdb
    env: &awsAuth
      Auth__Authority: https://{{ .Values.ingress.host }}/auth/realms/conexao-solidaria
      Auth__Issuer: https://{{ .Values.ingress.host }}/auth/realms/conexao-solidaria
      Auth__RequireHttpsMetadata: "true"
      Observability__LokiUrl: http://conexao-solidaria-loki:3100
  identity-api:
    autoscaling: *autoscaling
    disruptionBudget: *pdb
    env: *awsAuth
  campaigns-api:
    autoscaling: *autoscaling
    disruptionBudget: *pdb
    env: *awsAuth
  campaigns-worker:
    replicaCount: 2
    disruptionBudget: *pdb
    env:
      Observability__LokiUrl: http://conexao-solidaria-loki:3100
  payments-api:
    autoscaling: *autoscaling
    disruptionBudget: *pdb
    env: *awsAuth
  audit-api:
    autoscaling: *autoscaling
    disruptionBudget: *pdb
    env: *awsAuth
  knowledge-api:
    autoscaling: *autoscaling
    disruptionBudget: *pdb
  donations-api:
    replicaCount: 2
    disruptionBudget: *pdb

ingress:
  enabled: true
  className: nginx
  host: conexao-solidaria.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
  additionalPaths:
    - path: /auth
      pathType: Prefix
      serviceName: conexao-solidaria-keycloak
      servicePort: 8080
  tls:
    enabled: true
    secretName: conexao-solidaria-tls

certManager:
  clusterIssuer:
    enabled: true
    name: letsencrypt-production
    email: bruno.loures@hotmail.com

networkPolicy:
  enabled: true
  allowedIngressNamespaces:
    - ingress-nginx
