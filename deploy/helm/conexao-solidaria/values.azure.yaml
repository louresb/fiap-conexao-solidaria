global:
  environment: production
  cloudProvider: azure
  observability:
    otlpEndpoint: http://conexao-solidaria-otel-collector:4317

image:
  registry: <acr-name>.azurecr.io
  tag: latest

defaults:
  resources:
    requests:
      cpu: 50m

components:
  web:
    replicaCount: 1
    autoscaling: &autoscaling
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    env:
      Gateway__BaseUrl: http://conexao-solidaria-gateway:8080
      Auth__Authority: https://{{ .Values.ingress.host }}/auth/realms/conexao-solidaria
      Auth__RequireHttpsMetadata: "true"
      Proxy__TrustForwardedHeaders: "true"
      DemoAccess__Enabled: "true"
      Observability__LokiUrl: http://conexao-solidaria-loki:3100
      Readiness__Dependencies__IdentityProvider: http://conexao-solidaria-keycloak:8080/auth/realms/conexao-solidaria/.well-known/openid-configuration
  gateway:
    replicaCount: 1
    autoscaling: *autoscaling
    env: &azureAuth
      Auth__Authority: https://{{ .Values.ingress.host }}/auth/realms/conexao-solidaria
      Auth__Issuer: https://{{ .Values.ingress.host }}/auth/realms/conexao-solidaria
      Auth__RequireHttpsMetadata: "true"
      Observability__LokiUrl: http://conexao-solidaria-loki:3100
  identity-api:
    replicaCount: 1
    autoscaling: *autoscaling
    env:
      <<: *azureAuth
      Keycloak__BaseUrl: http://conexao-solidaria-keycloak:8080/auth
  campaigns-api:
    replicaCount: 1
    autoscaling: *autoscaling
    env: *azureAuth
  campaigns-worker:
    replicaCount: 1
    env:
      Observability__LokiUrl: http://conexao-solidaria-loki:3100
  payments-api:
    replicaCount: 1
    autoscaling: *autoscaling
    env: *azureAuth
  donations-api:
    replicaCount: 1
    autoscaling: *autoscaling
    env: *azureAuth
  audit-api:
    replicaCount: 1
    autoscaling: *autoscaling
    env: *azureAuth
  knowledge-api:
    replicaCount: 1
    autoscaling: *autoscaling
    env:
      Observability__LokiUrl: http://conexao-solidaria-loki:3100

ingress:
  enabled: true
  className: conexao-solidaria-public
  host: conexao-solidaria.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
    nginx.ingress.kubernetes.io/session-cookie-name: "conexao-solidaria-affinity"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
  additionalPaths:
    - path: /api
      pathType: Prefix
      serviceName: conexao-solidaria-gateway
      servicePort: 8080
    - path: /auth
      pathType: Prefix
      serviceName: conexao-solidaria-keycloak
      servicePort: 8080
  tls:
    enabled: true
    secretName: conexao-solidaria-tls

certManager:
  clusterIssuer:
    enabled: true
    name: letsencrypt-production
    email: bruno.loures@hotmail.com

azureRouting:
  enabled: true
  publicIpName: pip-conexao-solidaria-production
  publicIpResourceGroup: rg-conexao-solidaria-production

networkPolicy:
  enabled: true
  allowedIngressNamespaces:
    - app-routing-system

topologySpreadConstraints:
  enabled: false
