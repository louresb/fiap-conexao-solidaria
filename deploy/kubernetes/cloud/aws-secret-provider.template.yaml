apiVersion: v1
kind: ServiceAccount
metadata:
  name: conexao-solidaria-secret-sync
  namespace: conexao-solidaria
  labels:
    app.kubernetes.io/name: secret-sync
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: conexao-solidaria
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: conexao-solidaria-secrets-manager
  namespace: conexao-solidaria
spec:
  provider: aws
  secretObjects:
    - secretName: conexao-solidaria-runtime
      type: Opaque
      data:
        - { objectName: postgres-password, key: postgres-password }
        - { objectName: rabbitmq-password, key: rabbitmq-password }
        - { objectName: redis-password, key: redis-password }
        - { objectName: mongo-password, key: mongo-password }
        - { objectName: keycloak-admin-password, key: keycloak-admin-password }
        - { objectName: keycloak-client-secret, key: keycloak-client-secret }
        - { objectName: grafana-admin-password, key: grafana-admin-password }
        - { objectName: zabbix-admin-password, key: zabbix-admin-password }
        - { objectName: zabbix-db-password, key: zabbix-db-password }
        - { objectName: payment-webhook-secret, key: payment-webhook-secret }
        - { objectName: demo-manager-password, key: demo-manager-password }
        - { objectName: demo-donor-password, key: demo-donor-password }
        - { objectName: demo-admin-password, key: demo-admin-password }
        - { objectName: ai-api-key, key: ai-api-key }
        - { objectName: identity-db-connection, key: identity-db-connection }
        - { objectName: campaigns-db-connection, key: campaigns-db-connection }
        - { objectName: donations-db-connection, key: donations-db-connection }
        - { objectName: payments-db-connection, key: payments-db-connection }
        - { objectName: redis-connection, key: redis-connection }
        - { objectName: mongo-connection, key: mongo-connection }
  parameters:
    usePodIdentity: "true"
    region: "__AWS_REGION__"
    objects: |
      - objectName: "__RUNTIME_SECRET_ARN__"
        objectType: secretsmanager
        jmesPath:
          - { path: postgresPassword, objectAlias: postgres-password }
          - { path: rabbitmqPassword, objectAlias: rabbitmq-password }
          - { path: redisPassword, objectAlias: redis-password }
          - { path: mongoPassword, objectAlias: mongo-password }
          - { path: keycloakAdminPassword, objectAlias: keycloak-admin-password }
          - { path: keycloakClientSecret, objectAlias: keycloak-client-secret }
          - { path: grafanaAdminPassword, objectAlias: grafana-admin-password }
          - { path: zabbixAdminPassword, objectAlias: zabbix-admin-password }
          - { path: zabbixDbPassword, objectAlias: zabbix-db-password }
          - { path: paymentWebhookSecret, objectAlias: payment-webhook-secret }
          - { path: demoManagerPassword, objectAlias: demo-manager-password }
          - { path: demoDonorPassword, objectAlias: demo-donor-password }
          - { path: demoAdminPassword, objectAlias: demo-admin-password }
          - { path: aiApiKey, objectAlias: ai-api-key }
          - { path: identityDbConnection, objectAlias: identity-db-connection }
          - { path: campaignsDbConnection, objectAlias: campaigns-db-connection }
          - { path: donationsDbConnection, objectAlias: donations-db-connection }
          - { path: paymentsDbConnection, objectAlias: payments-db-connection }
          - { path: redisConnection, objectAlias: redis-connection }
          - { path: mongoConnection, objectAlias: mongo-connection }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conexao-solidaria-secret-sync
  namespace: conexao-solidaria
  labels:
    app.kubernetes.io/name: secret-sync
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: conexao-solidaria
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secret-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secret-sync
        app.kubernetes.io/component: security
        app.kubernetes.io/part-of: conexao-solidaria
    spec:
      serviceAccountName: conexao-solidaria-secret-sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: registry.k8s.io/pause:3.10.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 25m, memory: 32Mi }
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: conexao-solidaria-secrets-manager
