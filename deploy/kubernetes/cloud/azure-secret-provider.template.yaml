apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: conexao-solidaria-key-vault
  namespace: conexao-solidaria
spec:
  provider: azure
  secretObjects:
    - secretName: conexao-solidaria-runtime
      type: Opaque
      data:
        - { objectName: postgres-password, key: postgres-password }
        - { objectName: rabbitmq-password, key: rabbitmq-password }
        - { objectName: redis-password, key: redis-password }
        - { objectName: mongo-password, key: mongo-password }
        - { objectName: keycloak-admin-password, key: keycloak-admin-password }
        - { objectName: keycloak-client-secret, key: keycloak-client-secret }
        - { objectName: grafana-admin-password, key: grafana-admin-password }
        - { objectName: zabbix-admin-password, key: zabbix-admin-password }
        - { objectName: zabbix-db-password, key: zabbix-db-password }
        - { objectName: payment-webhook-secret, key: payment-webhook-secret }
        - { objectName: demo-manager-password, key: demo-manager-password }
        - { objectName: demo-donor-password, key: demo-donor-password }
        - { objectName: demo-admin-password, key: demo-admin-password }
        - { objectName: ai-api-key, key: ai-api-key }
        - { objectName: identity-db-connection, key: identity-db-connection }
        - { objectName: campaigns-db-connection, key: campaigns-db-connection }
        - { objectName: donations-db-connection, key: donations-db-connection }
        - { objectName: payments-db-connection, key: payments-db-connection }
        - { objectName: redis-connection, key: redis-connection }
        - { objectName: mongo-connection, key: mongo-connection }
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "__CSI_CLIENT_ID__"
    keyvaultName: "__KEY_VAULT_NAME__"
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: rabbitmq-password
          objectType: secret
        - |
          objectName: redis-password
          objectType: secret
        - |
          objectName: mongo-password
          objectType: secret
        - |
          objectName: keycloak-admin-password
          objectType: secret
        - |
          objectName: keycloak-client-secret
          objectType: secret
        - |
          objectName: grafana-admin-password
          objectType: secret
        - |
          objectName: zabbix-admin-password
          objectType: secret
        - |
          objectName: zabbix-db-password
          objectType: secret
        - |
          objectName: payment-webhook-secret
          objectType: secret
        - |
          objectName: demo-manager-password
          objectType: secret
        - |
          objectName: demo-donor-password
          objectType: secret
        - |
          objectName: demo-admin-password
          objectType: secret
        - |
          objectName: ai-api-key
          objectType: secret
        - |
          objectName: identity-db-connection
          objectType: secret
        - |
          objectName: campaigns-db-connection
          objectType: secret
        - |
          objectName: donations-db-connection
          objectType: secret
        - |
          objectName: payments-db-connection
          objectType: secret
        - |
          objectName: redis-connection
          objectType: secret
        - |
          objectName: mongo-connection
          objectType: secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conexao-solidaria-secret-sync
  namespace: conexao-solidaria
  labels:
    app.kubernetes.io/name: secret-sync
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: conexao-solidaria
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secret-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secret-sync
        app.kubernetes.io/component: security
        app.kubernetes.io/part-of: conexao-solidaria
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: registry.k8s.io/pause:3.10.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 25m, memory: 32Mi }
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: conexao-solidaria-key-vault
