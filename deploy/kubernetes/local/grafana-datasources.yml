apiVersion: 1

datasources:
  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://conexao-solidaria-prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: Loki
    type: loki
    access: proxy
    url: http://conexao-solidaria-loki:3100
    editable: false
  - name: Tempo
    uid: Tempo
    type: tempo
    access: proxy
    url: http://conexao-solidaria-tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: Loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        filterByTraceID: true
        filterBySpanID: true
      tracesToMetrics:
        datasourceUid: Prometheus
