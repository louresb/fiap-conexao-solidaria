apiVersion: batch/v1
kind: Job
metadata:
  name: conexao-solidaria-keycloak-seed
  labels:
    app.kubernetes.io/name: keycloak-seed
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: conexao-solidaria
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-seed
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: conexao-solidaria
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: quay.io/keycloak/keycloak:26.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/bash", "/seed/seed-users.sh"]
          env:
            - { name: KEYCLOAK_SERVER, value: http://conexao-solidaria-keycloak:8080 }
            - { name: KEYCLOAK_ADMIN, value: admin }
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conexao-solidaria-runtime
                  key: keycloak-admin-password
            - name: KEYCLOAK_WEB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: conexao-solidaria-runtime
                  key: keycloak-client-secret
            - name: DEMO_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conexao-solidaria-runtime
                  key: demo-manager-password
            - name: DEMO_DONOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conexao-solidaria-runtime
                  key: demo-donor-password
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 384Mi }
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seed
          projected:
            sources:
              - configMap:
                  name: conexao-solidaria-keycloak-seed
                  items:
                    - key: seed-users.sh
                      path: seed-users.sh
              - configMap:
                  name: conexao-solidaria-keycloak-profile
                  items:
                    - key: user-profile.json
                      path: user-profile.json
