global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: conexao-solidaria-apps
    metrics_path: /metrics
    static_configs:
      - targets:
          - conexao-solidaria-web:80
          - conexao-solidaria-gateway:8080
          - conexao-solidaria-identity-api:8080
          - conexao-solidaria-campaigns-api:8080
          - conexao-solidaria-payments-api:8080
          - conexao-solidaria-audit-api:8080
          - conexao-solidaria-knowledge-api:8080
          - conexao-solidaria-donations-worker:8080
  - job_name: rabbitmq
    static_configs:
      - targets: [conexao-solidaria-rabbitmq:15692]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: [conexao-solidaria-keycloak:9000]
