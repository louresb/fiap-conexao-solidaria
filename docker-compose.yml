name: conexao-solidaria

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: conexao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?execute scripts/Initialize-LocalEnvironment.ps1}
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conexao -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?execute scripts/Initialize-LocalEnvironment.ps1}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?execute scripts/Initialize-LocalEnvironment.ps1}
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: conexao
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?execute scripts/Initialize-LocalEnvironment.ps1}
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 8s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: conexao
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?execute scripts/Initialize-LocalEnvironment.ps1}
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "conexao", "--password", "${MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 8s
      timeout: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports: ["9200:9200", "9600:9600"]
    volumes: ["opensearch-data:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3
    profiles: ["tools"]
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["5601:5601"]
    depends_on:
      opensearch: { condition: service_healthy }

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?execute scripts/Initialize-LocalEnvironment.ps1}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["8080:8080", "9000:9000"]
    volumes:
      - ./infra/keycloak/conexao-solidaria-realm.json:/opt/keycloak/data/import/conexao-solidaria-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 8s
      timeout: 4s
      retries: 30

  keycloak-seed:
    image: quay.io/keycloak/keycloak:26.2
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?execute scripts/Initialize-LocalEnvironment.ps1}
      DEMO_MANAGER_PASSWORD: ${DEMO_MANAGER_PASSWORD:?execute scripts/Initialize-LocalEnvironment.ps1}
      DEMO_DONOR_PASSWORD: ${DEMO_DONOR_PASSWORD:?execute scripts/Initialize-LocalEnvironment.ps1}
    volumes: ["./infra/keycloak:/seed:ro"]
    entrypoint: ["/bin/bash", "/seed/seed-users.sh"]
    depends_on:
      keycloak: { condition: service_healthy }

  loki:
    image: grafana/loki:3.5
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    volumes: ["loki-data:/loki"]

  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?execute scripts/Initialize-LocalEnvironment.ps1}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]

  zabbix-db:
    image: postgres:17-alpine
    profiles: ["ops"]
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?execute scripts/Initialize-LocalEnvironment.ps1}
      POSTGRES_DB: zabbix
    volumes: ["zabbix-db-data:/var/lib/postgresql/data"]

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.2-latest
    profiles: ["ops"]
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?execute scripts/Initialize-LocalEnvironment.ps1}
      POSTGRES_DB: zabbix
    depends_on: [zabbix-db]

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.2-latest
    profiles: ["ops"]
    ports: ["8085:8080"]
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?execute scripts/Initialize-LocalEnvironment.ps1}
      POSTGRES_DB: zabbix
      PHP_TZ: America/Sao_Paulo
    depends_on: [zabbix-server]

  identity-api:
    build: { context: ., dockerfile: src/Services/Identity/ConexaoSolidaria.Identity.Api/Dockerfile }
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityDb: "Host=postgres;Port=5432;Database=conexao_identity;Username=conexao;Password=${POSTGRES_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: conexao
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Observability__LokiUrl: http://loki:3100
      Keycloak__Enabled: "true"
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__AdminUser: admin
      Keycloak__AdminPassword: ${KEYCLOAK_ADMIN_PASSWORD}
      Auth__Authority: http://keycloak:8080/realms/conexao-solidaria
      Auth__Issuer: http://localhost:8080/realms/conexao-solidaria
      Auth__Audience: conexao-solidaria
    ports: ["5101:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      keycloak-seed: { condition: service_completed_successfully }

  campaigns-api:
    build: { context: ., dockerfile: src/Services/Campaigns/ConexaoSolidaria.Campaigns.Api/Dockerfile }
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CampaignsDb: "Host=postgres;Port=5432;Database=conexao_campaigns;Username=conexao;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: conexao
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      OpenSearch__Enabled: "true"
      OpenSearch__BaseUrl: http://opensearch:9200
      Observability__LokiUrl: http://loki:3100
      Auth__Authority: http://keycloak:8080/realms/conexao-solidaria
      Auth__Issuer: http://localhost:8080/realms/conexao-solidaria
      Auth__Audience: conexao-solidaria
      Auth__Enforce: "true"
    ports: ["5102:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      keycloak-seed: { condition: service_completed_successfully }

  payments-api:
    build: { context: ., dockerfile: src/Services/Payments/ConexaoSolidaria.Payments.Api/Dockerfile }
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PaymentsDb: "Host=postgres;Port=5432;Database=conexao_payments;Username=conexao;Password=${POSTGRES_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: conexao
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      FakePayment__WebhookSecret: ${PAYMENT_WEBHOOK_SECRET}
      Observability__LokiUrl: http://loki:3100
      Auth__Authority: http://keycloak:8080/realms/conexao-solidaria
      Auth__Issuer: http://localhost:8080/realms/conexao-solidaria
      Auth__Audience: conexao-solidaria
      Auth__Enforce: "true"
    ports: ["5103:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      keycloak-seed: { condition: service_completed_successfully }

  donations-worker:
    build: { context: ., dockerfile: src/Services/Donations/ConexaoSolidaria.Donations.Worker/Dockerfile }
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CampaignsDb: "Host=postgres;Port=5432;Database=conexao_campaigns;Username=conexao;Password=${POSTGRES_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: conexao
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Observability__LokiUrl: http://loki:3100
    ports: ["5106:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  audit-api:
    build: { context: ., dockerfile: src/Services/Audit/ConexaoSolidaria.Audit.Api/Dockerfile }
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Mongo: "mongodb://conexao:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin"
      Mongo__Database: conexao_audit
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: conexao
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Observability__LokiUrl: http://loki:3100
      Auth__Authority: http://keycloak:8080/realms/conexao-solidaria
      Auth__Issuer: http://localhost:8080/realms/conexao-solidaria
      Auth__Audience: conexao-solidaria
    ports: ["5104:8080"]
    depends_on:
      mongodb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      keycloak-seed: { condition: service_completed_successfully }

  knowledge-api:
    build: { context: ., dockerfile: src/Services/Knowledge/ConexaoSolidaria.Knowledge.Api/Dockerfile }
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: conexao
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Observability__LokiUrl: http://loki:3100
    ports: ["5105:8080"]
    depends_on:
      rabbitmq: { condition: service_healthy }

  gateway:
    build: { context: ., dockerfile: src/Gateway/ConexaoSolidaria.Gateway/Dockerfile }
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Auth__Authority: http://keycloak:8080/realms/conexao-solidaria
      Auth__Issuer: http://localhost:8080/realms/conexao-solidaria
      Auth__Audience: conexao-solidaria
      Auth__RequireHttpsMetadata: "false"
      Observability__LokiUrl: http://loki:3100
    ports: ["5100:8080"]
    depends_on: [identity-api, campaigns-api, payments-api, audit-api, knowledge-api]

  web:
    build: { context: ., dockerfile: src/Web/ConexaoSolidaria.Web/Dockerfile }
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Gateway__BaseUrl: http://gateway:8080
      Auth__Authority: http://keycloak:8080/realms/conexao-solidaria
      Auth__RequireHttpsMetadata: "false"
      DemoAccess__Enabled: "true"
      DemoAccess__ManagerPassword: ${DEMO_MANAGER_PASSWORD}
      DemoAccess__DonorPassword: ${DEMO_DONOR_PASSWORD}
      Observability__LokiUrl: http://loki:3100
    ports: ["5000:8080"]
    depends_on:
      gateway: { condition: service_started }
      keycloak-seed: { condition: service_completed_successfully }

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  mongo-data:
  opensearch-data:
  keycloak-data:
  loki-data:
  prometheus-data:
  grafana-data:
  zabbix-db-data:
