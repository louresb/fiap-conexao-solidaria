global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: web
    static_configs:
      - targets: ["web:8080"]

  - job_name: identity-api
    static_configs:
      - targets: ["identity-api:8080"]

  - job_name: campaigns-api
    static_configs:
      - targets: ["campaigns-api:8080"]

  - job_name: payments-api
    static_configs:
      - targets: ["payments-api:8080"]

  - job_name: audit-api
    static_configs:
      - targets: ["audit-api:8080"]

  - job_name: knowledge-api
    static_configs:
      - targets: ["knowledge-api:8080"]

  - job_name: donations-worker
    static_configs:
      - targets: ["donations-worker:8080"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
